<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Cpath d='M7 8h18v5h-6v13h-6V13H7' fill='white'/%3E%3C/svg%3E"><title>TechStore · Resultados de pruebas reales</title><style>body{font:17px/1.5 'Segoe UI',sans-serif;margin:0;background:#f2f5fa;color:#16304f}header{background:#102542;color:white;padding:24px 42px}header b{font-size:25px}header span{float:right;font-size:15px}main{max-width:1160px;margin:28px auto}h1{font-size:26px}article{border:1px solid #ccd9e8;background:white;padding:18px 24px;margin:16px 0;border-radius:9px}h2{font-size:19px;margin:0 0 10px}.meta{color:#556980;font:14px Consolas;margin-bottom:10px}.status{float:right;background:#e4f5ed;color:#08613e;padding:4px 10px;border-radius:5px;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0;font:15px/1.45 Consolas;background:#f1f5fa;padding:14px}small{font-size:13px;color:#64748b}</style><link rel="stylesheet" href="/assets/theme.css"><header><b>TechStore</b><span>Registro de ejecución local</span></header><main><h1 id="title"></h1><p>Respuestas obtenidas del servidor al ejecutar las pruebas. Cuentas y productos de prueba.</p><div id="cases"></div><small>Origen de las pruebas: http://127.0.0.1:8765 · Las claves, contraseñas y tokens completos no se incluyen.</small></main><script>
(async()=>{const q=new URLSearchParams(location.search);const group=q.get('group')||'02';const start=Number(q.get('start')||0),count=Number(q.get('count')||3);const data=await(await fetch('/api/evidence')).json();const rows=data.filter(x=>x.group.startsWith(group)).slice(start,start+count);document.getElementById('title').textContent=rows[0]?.group||'Resultados';for(const r of rows){const a=document.createElement('article'),s=document.createElement('span'),h=document.createElement('h2'),m=document.createElement('div'),pre=document.createElement('pre');s.className='status';s.textContent='Verificado · '+r.status;h.textContent=r.title;m.className='meta';m.textContent=r.method+' '+r.path+' · '+r.at;let response=r.response;if(response.users)response={...response,users:response.users.filter(x=>x.email.includes(data.find(x=>x.title==='Administrador consulta usuarios y roles').response.users.at(-1).email.split('.').slice(-2).join('.')))};pre.textContent=JSON.stringify(response,null,2);a.append(s,h,m,pre);document.getElementById('cases').append(a)}document.body.dataset.ready='true'})();
</script><script src="/assets/theme.js"></script></html>
